# name = "metrics_history"
# location = "az://archive/metrics/"
# azure = { account = "mystorageacct", access_key_env = "AZURE_STORAGE_ACCOUNT_KEY" }

# [[sources]]
# kind = "csv"
# name = "regions"
# location = "./examples/regions.csv"

# [[sources]]
# kind = "databricks"              # SQL Statement Execution API, Arrow results, no driver needed
# name = "sales"
# host = "https://adb-1234567890123456.7.azuredatabricks.net"
# warehouse_id = "abcdef1234567890"
# table = "main.finance.sales"     # or: query = "SELECT ... FROM ..."
# token_env = "DATABRICKS_TOKEN"   # PAT / Entra token, or OAuth M2M:
# # client_id = "<service-principal-application-id>"
# # client_secret_env = "DATABRICKS_CLIENT_SECRET"

# ---------------------------------------------------------------------------
# Quack (DuckDB client-server protocol) on the same port:
#   ATTACH 'quack:localhost:9494' AS gw;  FROM gw.sales;  FROM gw.system.agent_tool_calls;
# ---------------------------------------------------------------------------
# DuckDB's quack secret TOKEN is any enact-db credential (API token, OIDC JWT, admin token).

# ---------------------------------------------------------------------------
# Apache Iceberg REST catalogs (Lakekeeper, Polaris / Snowflake Open Catalog, Unity, Nessie)
# ---------------------------------------------------------------------------
# [[iceberg]]
# name = "lake"                    # -> lake.<namespace>.<table>
# uri = "http://lakekeeper:8181/catalog"
# warehouse = "prod"
# credential_env = "LAKE_CLIENT_CREDENTIALS"   # "client_id:client_secret" (OAuth2) or token_env = "..."
# scope = "lakekeeper"
# props = { "s3.endpoint" = "http://minio:9000", "s3.region" = "us-east-1" }
# refresh_secs = 60

# ---------------------------------------------------------------------------
# Permissions (Lakekeeper-style). Without [auth] the server runs in open mode
# (loopback only).
# ---------------------------------------------------------------------------
# [auth]
# admin_token = "change-me"        # break-glass; bypasses checks, always audited
# allow_anonymous = false
#
# [auth.oidc]
# issuer = "https://login.microsoftonline.com/<tenant>/v2.0"
# audience = ["api://enact-db"]
# roles_claim = "roles"            # -> role:oidc:<value>
# agent_claim = { claim = "idtyp", value = "app" }
# required_claims = { tid = "<tenant-id>" }   # admission gate
#
# [[auth.roles]]
# id = "analysts"
# members = ["user:alice@contoso.com"]
#
# [[auth.grants]]
# principal = "role:analysts"
# resource = "schema:gateway/public"   # subtree: every table in the schema
# privilege = "select"
#
# [[auth.grants]]
# principal = "role:oidc:member"
# resource = "docs"
# privilege = "create"             # members may start documents (and own them)

